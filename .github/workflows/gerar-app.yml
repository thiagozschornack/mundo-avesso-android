# Gera o app Mundo Avesso na nuvem do GitHub (aba "Actions").
# - Sempre: APK de teste (instala direto no celular).
# - Se os segredos da chave estiverem cadastrados: APK e AAB assinados (o AAB vai para a Google Play).
name: Gerar app Android

on:
  workflow_dispatch:        # botão "Run workflow" na aba Actions
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Permissão do Gradle
        run: chmod +x gradlew

      - name: APK de teste
        run: ./gradlew assembleDebug --no-daemon

      - name: Guardar APK de teste
        uses: actions/upload-artifact@v4
        with:
          name: MundoAvesso-teste-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Preparar chave de assinatura
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: APK e AAB assinados
        if: env.KEYSTORE_BASE64 != ''
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Guardar versão para a loja
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: MundoAvesso-loja
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
